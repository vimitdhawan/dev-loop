[project]
name = "devloop"
version = "0.1.0"
description = "Autonomous development loop: issue/task -> requirements -> plan -> code -> tests -> review -> PR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.scripts]
devloop = "devloop.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# We only write function-based tests; disable class-based collection so
# pydantic model names like TestRunResult/TestFailure aren't mistaken for
# test classes (they're contract types, not tests).
python_classes = "Never_"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devloop"]
